name: syndra-data-engine

# Rotate container logs (3 x 10MB): json-file keeps everything by default and
# would fill the disk in silence. Lasting history lives in Postgres and Prefect.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Third-party images are pinned by tag (for humans) and digest (for Docker):
# a floating tag moved on its own on 28/09/2026. Upgrade by editing the line.
services:

  # --- Data stores ---------------------------------------------------------
  # Ports bound to loopback only, for SSH tunnels; containers use syndra_net.

  postgres:
    image: postgres:15.19-alpine3.24@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    container_name: syndra_postgres
    logging: *default-logging
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - syndra_pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh
    networks:
      - syndra_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.0@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
    container_name: syndra_qdrant
    logging: *default-logging
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - syndra_qdrant_data:/qdrant/storage
    networks:
      - syndra_net
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine3.21@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: syndra_redis
    logging: *default-logging
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - syndra_net
    restart: unless-stopped
    volumes:
      - syndra_redis_data:/data

  # --- Application ---------------------------------------------------------
  # API and scheduler are one image, tagged with the git SHA by deploy.sh so
  # any deploy can be rolled back (ADR 022). :-latest only avoids an empty name.

  api:
    image: ghcr.io/fransmm/syndra-etl:${ETL_TAG:-latest}
    container_name: syndra_api
    logging: *default-logging
    # No host ports: reachable only through Caddy.
    env_file: .env
    # One worker so Prometheus scrapes a single metrics registry (ADR 039).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    networks:
      - syndra_net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    deploy:
      resources:
        limits:
          # Peak ~420MB with one worker; a limit is a ceiling, not a reservation.
          memory: 1.25G

  prefect_server:
    image: prefecthq/prefect:3.8.6-python3.12@sha256:ec9e58deaf30002dd65ebb755ca3d9eb5f169902882abf18c79261a4aa95bfe3
    container_name: syndra_prefect_server
    logging: *default-logging
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    env_file: .env
    environment:
      - PREFECT_API_URL=http://127.0.0.1:4200/api
    ports:
      - "127.0.0.1:4200:4200"
    networks:
      - syndra_net
    restart: unless-stopped
    # Required: the scheduler waits for service_healthy, not service_started.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:4200/api/health',timeout=4).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  scheduler:
    image: ghcr.io/fransmm/syndra-etl:${ETL_TAG:-latest}
    container_name: syndra_scheduler
    logging: *default-logging
    env_file: .env
    environment:
      - PREFECT_API_URL=http://prefect_server:4200/api
    command: ["python", "-m", "app.pipeline"]
    networks:
      - syndra_net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      prefect_server:
        condition: service_healthy
      qdrant:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2.5G

  demo:
    image: ghcr.io/fransmm/syndra-demo:${DEMO_TAG:-latest}
    container_name: syndra_demo
    logging: *default-logging
    # No host ports: reachable only through Caddy.
    networks:
      - syndra_net
    restart: unless-stopped
    volumes:
      # Read-only demo key. The file is 0600 and owned by uid 1000, like the image user.
      - ./streamlit-secrets.toml:/app/.streamlit/secrets.toml:ro
    deploy:
      resources:
        limits:
          # The only public unauthenticated entry point: if it runs away, it dies alone.
          memory: 384M
    # No depends_on api: the page still loads and explains itself if the API is down.

  # --- Observability -------------------------------------------------------

  # Per-container CPU and memory, e.g. what a FinBERT batch costs the scheduler.
  cadvisor:
    # gcr.io: the Docker Hub image stopped at v0.33.0 in 2019.
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: syndra_cadvisor
    logging: *default-logging
    # Defaults target a Kubernetes node; these keep it cheap on 2 vCPU.
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=15s"
      - "--store_container_labels=false"
      # Metrics that multiply series without answering anything here.
      - "--disable_metrics=percpu,sched,tcp,udp,hugetlb,referenced_memory,cpu_topology,resctrl,advtcp,memory_numa,process"
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - syndra_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Sits near the cap on reclaimable page cache; heap (anon) is ~8MB.
          # Only a rise in anon would be a real leak.
          memory: 256M

  # Host memory, disk and load: the context behind cAdvisor's numbers.
  node_exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: syndra_node_exporter
    logging: *default-logging
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
      # Skip Docker overlay mounts: dozens of series nobody can act on.
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    networks:
      - syndra_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: syndra_prometheus
    logging: *default-logging
    # Loopback only: Prometheus has no auth. Use ssh -L 9090:localhost:9090.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - syndra_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Time governs, size is only a safety net for the disk (ADR 040).
      - "--storage.tsdb.retention.time=180d"
      - "--storage.tsdb.retention.size=10GB"
    networks:
      - syndra_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # A cardinality mistake kills the monitoring, not the API.
          memory: 384M
    # No depends_on: it must keep running to record up == 0 when the API is down.

  # --- Ingress -------------------------------------------------------------

  # The only service exposed to the internet: TLS and routing (ADR 031).
  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    container_name: syndra_caddy
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - syndra_caddy_data:/data
      - syndra_caddy_config:/config
    networks:
      - syndra_net
    restart: unless-stopped
    depends_on:
      - api

networks:
  syndra_net:
    driver: bridge

volumes:
  syndra_pgdata:
  syndra_qdrant_data:
  syndra_redis_data:
  syndra_prometheus_data:
  syndra_caddy_data:
  syndra_caddy_config:
