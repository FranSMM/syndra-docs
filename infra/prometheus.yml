# Prometheus scrape configuration, mounted read-only by docker-compose.prod.yml.
# Versioned so every recorded series can be traced to the rules that made it.

global:
  # Default interval: finer adds nothing to an hourly pipeline, coarser blurs latency.
  scrape_interval: 15s
  # A hung API shows up as up == 0 instead of a stalled scrape.
  scrape_timeout: 10s

  external_labels:
    monitor: syndra
    environment: production

# All targets are reached by container name over syndra_net.
scrape_configs:
  # HTTP histograms plus domain gauges (ADR 038). Caddy returns 403 for /metrics.
  - job_name: syndra_api
    static_configs:
      - targets: ["syndra_api:8000"]

  # Per-container CPU and memory, e.g. the cost of FinBERT inference.
  - job_name: cadvisor
    static_configs:
      - targets: ["syndra_cadvisor:8080"]

  # Host memory, disk and load behind the container numbers.
  - job_name: node
    static_configs:
      - targets: ["syndra_node_exporter:9100"]

  # TSDB size and active series, the two numbers that go wrong quietly.
  # Most series are Prometheus itself. Not trimmed: the disk has room, and a
  # metric dropped in advance is the one you end up needing.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
